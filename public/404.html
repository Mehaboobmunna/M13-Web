<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BuildSmith</title>
  <script>
    // GitHub Pages SPA fallback: converts path into hash route
    var path = window.location.pathname;
    var repo = '/M13-Web';
    var relative = path.indexOf(repo) === 0 ? path.substring(repo.length) : path;
    if (relative.charAt(0) === '/') relative = relative.substring(1);
    var target = window.location.origin + repo + '/#/' + relative + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading BuildSmith...</p>
</body>
</html>
